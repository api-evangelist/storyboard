aid: storyboard
name: Storyboard
description: >-
  Storyboard is a fleet-operations AI platform that gives trucking and logistics
  companies voice-first, hands-free AI workers for their drivers. The system
  automates dispatch updates, driver coaching, safety alerts, and compliance
  monitoring (including hours-of-service and idling) so back-office teams field
  fewer phone calls and drivers stay hands-free on the road. Founded in 2017 and
  headquartered in Santa Monica, California, Storyboard began as an enterprise
  podcast and internal-audio communication platform (a $4.5M seed round led by
  CRV in 2020) before pivoting to AI-powered fleet operations. It is distributed
  through in-cab telematics marketplaces such as Platform Science and ISAAC
  Instruments. Storyboard exposes no public developer API, SDK, or documentation
  surface; access is via its web and mobile apps at app.storyboard.com. This
  profile was surfaced as a CRV portfolio company and enriched by the API
  Evangelist pipeline.
